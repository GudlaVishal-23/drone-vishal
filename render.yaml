services:
  - type: web
    name: saeindia-relay-server
    runtime: node
    plan: free
    rootDir: saeindia/relay-server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: RELAY_AUTH_TOKEN
        generateValue: true
      - key: NODE_ENV
        value: production
